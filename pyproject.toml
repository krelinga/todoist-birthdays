[project]
name = "birthday-todoist"
version = "0.1.0"
description = "Automatically generate birthday reminders in Todoist"
requires-python = ">=3.12"
dependencies = [
    "todoist-api-python>=4.0.0,<5",
    "pyyaml>=6.0,<7",
    "prometheus-client>=0.20,<1",
    "tenacity>=8.2,<9",
]

[dependency-groups]
dev = [
    "pytest>=8.0,<9",
    "pytest-mock>=3.14,<4",
    "freezegun>=1.5,<2",
    "ruff>=0.6",
]

[project.scripts]
birthday-todoist = "birthday_todoist.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/birthday_todoist"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
